<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد بیمار - دارویار (نسخه جدید)</title>

    <!-- Google Fonts: Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS Foundation & Theming --- */
        :root {
            --primary-color: #0d6efd;
            --primary-light: #3d8bfd;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;

            --light-bg: #f8f9fa;
            --light-card-bg: #ffffff;
            --light-card-bg-darker: #f1f3f5;
            --light-text: #212529;
            --light-text-muted: #6c757d;
            --light-border: #dee2e6;
            --light-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);

            --dark-bg: #121212;
            --dark-card-bg: #1e1e1e;
            --dark-card-bg-darker: #191919;
            --dark-text: #e9ecef;
            --dark-text-muted: #adb5bd;
            --dark-border: #343a40;
            --dark-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
        }

        [data-theme="light"] {
            --bg-color: var(--light-bg);
            --card-bg-color: var(--light-card-bg);
            --card-bg-color-darker: var(--light-card-bg-darker);
            --text-color: var(--light-text);
            --text-muted-color: var(--light-text-muted);
            --border-color: var(--light-border);
            --shadow: var(--light-shadow);
        }

        [data-theme="dark"] {
            --bg-color: var(--dark-bg);
            --card-bg-color: var(--dark-card-bg);
            --card-bg-color-darker: var(--dark-card-bg-darker);
            --text-color: var(--dark-text);
            --text-muted-color: var(--dark-text-muted);
            --border-color: var(--dark-border);
            --shadow: var(--dark-shadow);
        }

        /* --- Basic Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* --- Header Structure (Placeholders) --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        /* --- Progress Circle --- */
        .progress-circle-container {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .progress-ring__bg {
            stroke: var(--border-color);
            transition: stroke 0.3s ease;
        }

        .progress-ring__fg {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke: var(--success-color);
            transition: stroke-dashoffset 0.5s ease;
        }

        /* --- Timeline Structure (Placeholders) --- */
        .timeline-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 1.5rem 1.5rem 1.5rem;

            /* Make container bleed to edges */
            margin: 0 -1.5rem;

            /* Scroll Snapping */
            scroll-snap-type: x mandatory;

            /* Hide scrollbar visually but keep functionality */
            scrollbar-width: none; /* Firefox */
        }
        .timeline-container::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .timeline-section {
            flex: 0 0 90%; /* On mobile, a section takes most of the screen */
            min-width: 280px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            padding: 1.5rem;
            background-color: var(--card-bg-color-darker);
            border-radius: 12px;
            transition: background-color 0.3s ease;
        }

        .timeline-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--primary-light);
        }

        @media (min-width: 600px) {
            .timeline-section {
                flex-basis: 320px; /* On larger screens, set a fixed width */
            }
        }

        /* --- Card Flipper --- */
        .card-flipper {
            perspective: 1500px;
            margin-bottom: 1rem;
            min-height: 150px;
            cursor: pointer;
        }

        .flipper-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card-flipper.is-flipped .flipper-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            border-radius: 12px;
            background-color: var(--card-bg-color);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .card-front {
            border: 2px solid var(--primary-color);
        }

        .card-front h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }

        .card-front p {
            font-size: 0.9rem;
            color: var(--text-muted-color);
            margin-top: 0.5rem;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: var(--card-bg-color);
        }

        .card-back h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-back p {
            font-size: 1rem;
            color: var(--text-muted-color);
            margin-bottom: 1rem;
        }

        .med-button {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            color: #fff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .med-button:hover {
            background-color: var(--primary-light);
        }

        .med-button:active {
            transform: scale(0.98);
        }

        .med-button.taken {
            background-color: var(--success-color);
            cursor: not-allowed;
        }

        .card-flipper.is-complete {
            pointer-events: none;
            opacity: 0.6;
        }

        /* --- Theme Switch --- */
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:focus + .slider {
            box-shadow: 0 0 1px var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header class="header">
            <h1>دارویار</h1>
            <div class="header-controls">
                <!-- Progress Circle Placeholder -->
                <div class="progress-circle-container">
                    <svg class="progress-ring" width="60" height="60">
                        <circle class="progress-ring__bg" stroke-width="6" fill="transparent" r="26" cx="30" cy="30"/>
                        <circle class="progress-ring__fg" stroke-width="6" fill="transparent" r="26" cx="30" cy="30"/>
                    </svg>
                    <span class="progress-text">۰٪</span>
                </div>
                <!-- Theme Switch Placeholder -->
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="theme-toggle">
                        <input type="checkbox" id="theme-toggle" />
                        <div class="slider round"></div>
                    </label>
                </div>
            </div>
        </header>

        <main>
            <div class="timeline-container">
                <!-- Morning Section -->
                <section class="timeline-section">
                    <h2>صبح ☀️</h2>
                    <div class="card-flipper" data-med-id="1">
                        <div class="flipper-inner">
                            <div class="card-front">
                                <h3>متفورمین ۵۰۰</h3>
                                <p>مشاهده جزئیات</p>
                            </div>
                            <div class="card-back">
                                <h3>متفورمین ۵۰۰</h3>
                                <p>یک قرص، همراه با صبحانه</p>
                                <button class="med-button">مصرف شد</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-flipper" data-med-id="2">
                        <div class="flipper-inner">
                            <div class="card-front">
                                <h3>آتورواستاتین ۲۰</h3>
                                <p>مشاهده جزئیات</p>
                            </div>
                            <div class="card-back">
                                <h3>آتورواستاتین ۲۰</h3>
                                <p>یک قرص، بعد از صبحانه</p>
                                <button class="med-button">مصرف شد</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Noon Section -->
                <section class="timeline-section">
                    <h2>ظهر 🏙️</h2>
                    <div class="card-flipper" data-med-id="3">
                        <div class="flipper-inner">
                            <div class="card-front">
                                <h3>لوزارتان ۵۰</h3>
                                <p>مشاهده جزئیات</p>
                            </div>
                            <div class="card-back">
                                <h3>لوزارتان ۵۰</h3>
                                <p>یک قرص، همراه با ناهار</p>
                                <button class="med-button">مصرف شد</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Night Section -->
                <section class="timeline-section">
                    <h2>شب 🌙</h2>
                    <div class="card-flipper" data-med-id="4">
                        <div class="flipper-inner">
                            <div class="card-front">
                                <h3>آسپرین ۸۱</h3>
                                <p>مشاهده جزئیات</p>
                            </div>
                            <div class="card-back">
                                <h3>آسپرین ۸۱</h3>
                                <p>یک قرص، قبل از خواب</p>
                                <button class="med-button">مصرف شد</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- JS will be added in later steps -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- THEME SWITCH LOGIC ---
            const themeToggle = document.getElementById('theme-toggle');
            const htmlEl = document.documentElement;

            // Function to set the theme
            function setTheme(theme) {
                htmlEl.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }

            // Check for a saved theme in localStorage and apply it
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            themeToggle.checked = savedTheme === 'dark';

            // Event listener for the toggle switch
            themeToggle.addEventListener('change', () => {
                if (themeToggle.checked) {
                    setTheme('dark');
                } else {
                    setTheme('light');
                }
            });

            // --- CARD FLIP LOGIC ---
            const flippers = document.querySelectorAll('.card-flipper');
            flippers.forEach(flipper => {
                flipper.addEventListener('click', () => {
                    // Don't flip if the card is already marked as complete
                    if (flipper.classList.contains('is-complete')) {
                        return;
                    }
                    flipper.classList.toggle('is-flipped');
                });
            });

            // Prevent the card from flipping when the button is clicked
            // This is now part of the main completion logic below.

            // --- COMPLETION & PROGRESS LOGIC ---
            const medButtons = document.querySelectorAll('.med-button');
            const totalMeds = medButtons.length;
            let completedMeds = 0;

            const progressCircle = document.querySelector('.progress-ring__fg');
            const progressText = document.querySelector('.progress-text');
            const radius = progressCircle.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;

            // Function to set the progress
            function setProgress(percent) {
                const offset = circumference - (percent / 100) * circumference;
                progressCircle.style.strokeDashoffset = offset;
                progressText.textContent = `${Math.round(percent)}٪`;
            }

            // Initialize progress circle
            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            setProgress(0);

            medButtons.forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation(); // Stop the click from flipping the card

                    const card = button.closest('.card-flipper');

                    // Only proceed if the card hasn't been completed yet
                    if (!card.classList.contains('is-complete')) {
                        button.classList.add('taken');
                        button.textContent = 'انجام شد ✔';
                        button.disabled = true;

                        card.classList.add('is-complete');

                        // Update progress
                        completedMeds++;
                        const newProgress = (completedMeds / totalMeds) * 100;
                        setProgress(newProgress);

                        // Optional: Flip the card back after a short delay
                        setTimeout(() => {
                            card.classList.remove('is-flipped');
                        }, 1200);
                    }
                });
            });
        });
    </script>

</body>
</html>
